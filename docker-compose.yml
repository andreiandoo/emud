services:
  app:
    build: .
    image: emud-app:local
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  queue:
    image: emud-app:local
    env_file: .env
    command: php artisan queue:work redis --queue=default,imports,notifications --sleep=2 --tries=3 --timeout=1800
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped

  scheduler:
    image: emud-app:local
    env_file: .env
    command: php artisan schedule:work
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: docker/nginx.Dockerfile
    image: emud-nginx:local
    ports:
      - "8080:80"
    depends_on:
      - app
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-emud}
      POSTGRES_USER: ${DB_USERNAME:-emud}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-emud} -d ${DB_DATABASE:-emud}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres-data:
  redis-data:
