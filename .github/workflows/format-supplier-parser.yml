name: Format supplier parser

on:
  push:
    branches:
      - feature/permissioned-parts-feed-framework

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/permissioned-parts-feed-framework
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/pint app/Suppliers/Parsing/StructuredSupplierFeedParser.php
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Suppliers/Parsing/StructuredSupplierFeedParser.php
          git commit -m "Format supplier feed parser"
          git push origin HEAD:feature/permissioned-parts-feed-framework
