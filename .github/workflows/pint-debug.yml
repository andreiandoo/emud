name: Pint Debug

on:
  push:
    branches:
      - feature/part-graph-scale-hardening

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - run: composer install --prefer-dist --no-interaction --no-progress
      - name: Show Pint diff
        run: |
          vendor/bin/pint app/Catalog/Graph/PartGraphTraversal.php
          git diff -- app/Catalog/Graph/PartGraphTraversal.php
          if ! git diff --quiet -- app/Catalog/Graph/PartGraphTraversal.php; then exit 1; fi
