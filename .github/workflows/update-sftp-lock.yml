name: Update SFTP dependency lock

on:
  push:
    branches:
      - feature/permissioned-parts-feed-framework

permissions:
  contents: write

jobs:
  update-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: feature/permissioned-parts-feed-framework
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Update SFTP adapter lock
        run: composer update league/flysystem-sftp-v3 --with-dependencies --no-interaction --no-progress
      - name: Commit lockfile
        run: |
          if git diff --quiet composer.lock composer.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.json composer.lock
          git commit -m "Lock Flysystem SFTP adapter"
          git push origin HEAD:feature/permissioned-parts-feed-framework
