name: Pint Demo Debug

on:
  push:
    branches:
      - feature/catalog-demo-data

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - run: composer install --prefer-dist --no-interaction --no-progress
      - name: Show Pint diff
        run: |
          vendor/bin/pint database/seeders/AutomotiveCatalogDemoSeeder.php
          git diff -- database/seeders/AutomotiveCatalogDemoSeeder.php
          if ! git diff --quiet -- database/seeders/AutomotiveCatalogDemoSeeder.php; then exit 1; fi
