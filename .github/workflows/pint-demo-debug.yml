name: Pint Demo Debug

on:
  push:
    branches:
      - feature/catalog-demo-data

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/catalog-demo-data
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - run: composer install --prefer-dist --no-interaction --no-progress
      - name: Apply Pint output
        run: |
          vendor/bin/pint database/seeders/AutomotiveCatalogDemoSeeder.php
          if git diff --quiet -- database/seeders/AutomotiveCatalogDemoSeeder.php; then
            echo "Seeder already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/seeders/AutomotiveCatalogDemoSeeder.php
          git commit -m "Format automotive catalog demo seeder"
          git push origin HEAD:feature/catalog-demo-data
