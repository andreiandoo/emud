name: Format catalog branch

on:
  push:
    branches:
      - feature/catalog-ingestion-api

permissions:
  contents: write

jobs:
  pint:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feature/catalog-ingestion-api

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Format with Laravel Pint
        run: vendor/bin/pint

      - name: Commit formatter changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatter changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply Laravel Pint formatting"
          git push origin HEAD:feature/catalog-ingestion-api
