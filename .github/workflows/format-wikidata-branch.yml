name: Format Wikidata branch

on:
  push:
    branches:
      - feature/wikidata-catalog-enrichment

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: feature/wikidata-catalog-enrichment
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Format Wikidata enrichment
        run: vendor/bin/pint app/Catalog/Enrichment/Wikidata/WikidataVehicleEnricher.php
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Catalog/Enrichment/Wikidata/WikidataVehicleEnricher.php
          git commit -m "Format Wikidata enrichment with Pint"
          git push origin HEAD:feature/wikidata-catalog-enrichment
