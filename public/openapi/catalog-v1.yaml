openapi: 3.1.0
info:
  title: eMUD Automotive Catalog API
  version: 1.1.0
  description: >-
    Rights-filtered automotive catalog API. Only canonical facts backed by source
    evidence explicitly approved for API redistribution are exposed.
servers:
  - url: /api/v1
security:
  - ApiKeyHeader: []
  - BearerAuth: []
paths:
  /vin/{vin}:
    get:
      summary: Decode a VIN and map it to a canonical vehicle configuration
      parameters:
        - name: vin
          in: path
          required: true
          schema: { type: string, pattern: '^[A-HJ-NPR-Z0-9]{17}$' }
      responses:
        '200':
          description: VIN resolution result
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/VinResolution'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /vehicles/search:
    get:
      summary: Search canonical vehicle configurations
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: year, in: query, schema: { type: integer } }
        - { name: fuel, in: query, schema: { type: string } }
        - { name: market, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: Vehicle search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleListResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /vehicles/{vehicle}:
    get:
      summary: Get one canonical vehicle configuration
      parameters:
        - { name: vehicle, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Vehicle
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Vehicle' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Not found }
        '429': { $ref: '#/components/responses/RateLimited' }
  /vehicles/{vehicle}/parts:
    get:
      summary: Get confirmed or conditional parts for a vehicle configuration
      parameters:
        - { name: vehicle, in: path, required: true, schema: { type: integer } }
        - { name: category_id, in: query, schema: { type: integer } }
        - { name: position, in: query, schema: { type: string } }
        - { name: min_confidence, in: query, schema: { type: number, minimum: 0, maximum: 100 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: Parts matching the vehicle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartListResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Vehicle not found }
        '429': { $ref: '#/components/responses/RateLimited' }
  /parts/search:
    get:
      summary: Search parts by text, brand, MPN, OE/IAM number or compact identifier
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: brand, in: query, schema: { type: string } }
        - { name: category_id, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: Part search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartListResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /parts/by-number/{number}:
    get:
      summary: Resolve an OE, IAM, EAN or other known part number to canonical parts
      parameters:
        - { name: number, in: path, required: true, schema: { type: string } }
        - name: scheme
          in: query
          schema: { type: string, example: OE }
      responses:
        '200':
          description: Matching parts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Part' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /parts/by-number/{number}/graph:
    get:
      summary: Traverse API-redistributable equivalents and supersessions from a known part number
      description: >-
        Resolves the supplied number to one or more canonical seed parts, then performs a bounded
        cycle-safe traversal over canonical part relations. Both relation evidence and every returned
        part must independently be approved for API redistribution.
      parameters:
        - { name: number, in: path, required: true, schema: { type: string } }
        - { name: scheme, in: query, schema: { type: string, example: MPN } }
        - { name: depth, in: query, schema: { type: integer, minimum: 0, maximum: 4, default: 2 } }
        - { name: max_nodes, in: query, schema: { type: integer, minimum: 1, maximum: 250, default: 100 } }
      responses:
        '200':
          description: Bounded canonical part relation graph
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PartGraph' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { description: Validation error }
        '429': { $ref: '#/components/responses/RateLimited' }
  /parts/{part}:
    get:
      summary: Get one canonical part
      parameters:
        - name: part
          in: path
          required: true
          description: Public part identifier, with or without the `prt_` prefix.
          schema: { type: string }
      responses:
        '200':
          description: Part
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Part' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Not found }
        '429': { $ref: '#/components/responses/RateLimited' }
  /compatibility/check:
    post:
      summary: Check whether a canonical part fits a vehicle configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vehicle_id, part_id]
              properties:
                vehicle_id: { type: integer }
                part_id: { type: string, description: Public part identifier with or without `prt_` prefix. }
      responses:
        '200':
          description: Compatibility result
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Compatibility' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { description: Validation error }
        '429': { $ref: '#/components/responses/RateLimited' }
  /coverage:
    get:
      summary: Get current API-visible entity coverage
      responses:
        '200':
          description: Coverage counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      vehicle_configurations: { type: integer }
                      vehicle_generations: { type: integer }
                      parts: { type: integer }
                      generated_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /changes:
    get:
      summary: Read API-redistributable catalog change events
      parameters:
        - { name: since, in: query, schema: { type: string, format: date-time }, description: Defaults to 24 hours ago. }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
      responses:
        '200':
          description: Change events
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ChangeEvent' }
                  meta: { $ref: '#/components/schemas/LimitMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
components:
  securitySchemes:
    ApiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer
  responses:
    Unauthorized:
      description: Missing, invalid or inactive API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Monthly API quota or request throttle exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    LimitMeta:
      type: object
      properties:
        limit: { type: integer }
    VehicleListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Vehicle' }
        meta: { $ref: '#/components/schemas/LimitMeta' }
    PartListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Part' }
        meta: { $ref: '#/components/schemas/LimitMeta' }
    Vehicle:
      type: object
      properties:
        id: { type: string, example: veh_123 }
        make: { type: [string, 'null'] }
        model: { type: [string, 'null'] }
        generation: { type: [string, 'null'] }
        commercial_name: { type: [string, 'null'] }
        year: { type: [integer, 'null'] }
        model_year_from: { type: [integer, 'null'] }
        model_year_to: { type: [integer, 'null'] }
        market: { type: [string, 'null'] }
        engine: { type: [object, 'null'], additionalProperties: true }
        eu: { type: object, additionalProperties: true }
        identifiers:
          type: array
          items: { type: object, additionalProperties: true }
        quality: { type: object, additionalProperties: true }
    Part:
      type: object
      additionalProperties: true
      properties:
        id: { type: string, example: prt_01K... }
        brand: { type: [string, 'null'] }
        mpn: { type: string }
        name: { type: [string, 'null'] }
        numbers:
          type: array
          items: { type: object, additionalProperties: true }
    PartGraph:
      type: object
      required: [query, seeds, nodes, edges, truncated]
      properties:
        query:
          type: object
          properties:
            number: { type: string }
            scheme: { type: [string, 'null'] }
            depth: { type: integer }
        seeds:
          type: array
          items: { type: string, example: prt_01K... }
        nodes:
          type: array
          items:
            type: object
            properties:
              distance: { type: integer, minimum: 0 }
              part: { $ref: '#/components/schemas/Part' }
        edges:
          type: array
          items:
            type: object
            properties:
              from: { type: string }
              to: { type: string }
              relation_type: { type: string, example: equivalent }
              directed: { type: boolean }
              confidence: { type: [number, 'null'] }
              source: { type: [string, 'null'] }
        truncated: { type: boolean }
    VinResolution:
      type: object
      properties:
        vin: { type: string }
        resolution:
          type: string
          enum: [invalid, unsupported, unavailable, basic_only, ambiguous, high_confidence]
        confidence: { type: number, minimum: 0, maximum: 100 }
        vehicle:
          oneOf:
            - { $ref: '#/components/schemas/Vehicle' }
            - { type: 'null' }
        decoded: { type: object, additionalProperties: true }
        candidates:
          type: array
          items: { type: object, additionalProperties: true }
        missing_for_exact_fitment:
          type: array
          items: { type: string }
        message: { type: [string, 'null'] }
    Compatibility:
      type: object
      properties:
        compatible: { type: [boolean, 'null'] }
        status: { type: string, enum: [confirmed, conditional, unknown] }
        confidence: { type: [number, 'null'] }
        constraints:
          type: array
          items: { type: object, additionalProperties: true }
    ChangeEvent:
      type: object
      properties:
        id: { type: string }
        type: { type: string }
        entity_type: { type: string }
        entity_id: { type: [integer, 'null'] }
        payload: { type: [object, 'null'], additionalProperties: true }
        occurred_at: { type: [string, 'null'], format: date-time }
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
